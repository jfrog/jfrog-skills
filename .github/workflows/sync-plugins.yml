name: Sync Plugins

# When a v* tag is pushed, open a PR in every plugin
# listed in .github/plugins.json. Each PR vendors this repo's skills/
# at the tag into the plugin repo.
#
# Auth: jfrog-agentic-release-bot GitHub App → short-lived installation token.
#   vars.PUBLIC_REPO_CLIENT_ID + secrets.PUBLIC_REPO_APP_PRIVATE_KEY
#   App needs Contents:write + Pull requests:write on every jfrog/<plugin>
#   repo in plugins.json. Mint with explicit permission-* inputs.
#   github-api-url is pinned to api.github.com for consistency with the
#   GHES agent-hooks sync (harmless when this workflow already runs on github.com).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to sync (e.g. 0.22.0).'
        required: true
        type: string
      plugin:
        description: 'Plugin to sync. "all" syncs every entry in plugins.json.'
        required: true
        type: choice
        default: all
        options:
          - all
          - claude-plugin
          - cursor-plugin
          - vscode-plugin
          - codex-plugin
          - opencode-jfrog-plugin
          - jfrog-kiro-power
          - devin-plugin
          - jetbrains-plugin

permissions:
  contents: read

jobs:
  prepare:
    name: Build plugin matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Manual runs often omit the leading v (0.22.0); tags are always v*.
      - id: version
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RAW" in
            v*) version="$RAW" ;;
            *)  version="v$RAW" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Normalized VERSION=$version (from $RAW)"

      - name: Verify version tag exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag '$VERSION' does not exist in this repository. Pass an existing release tag (e.g. v0.22.0)."
            echo "Recent tags:"
            git tag --list 'v*' --sort=-v:refname | head -20
            exit 1
          fi
          echo "Verified tag $VERSION -> $(git rev-parse "refs/tags/$VERSION")"

      - id: matrix
        env:
          # Tag pushes have no inputs → all. Manual runs pass the choice input.
          PLUGIN: ${{ github.event.inputs.plugin || 'all' }}
        run: python3 .github/scripts/jfrog-sync-plugins.py matrix

  sync:
    name: Sync ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Generate github.com App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBLIC_REPO_CLIENT_ID }}
          private-key: ${{ secrets.PUBLIC_REPO_APP_PRIVATE_KEY }}
          owner: jfrog
          repositories: ${{ matrix.name }}
          github-api-url: https://api.github.com
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
          path: upstream

      - uses: actions/checkout@v7
        with:
          repository: jfrog/${{ matrix.name }}
          token: ${{ steps.app-token.outputs.token }}
          path: plugin

      - name: Copy skills into plugin
        env:
          DEST_PREFIX: ${{ matrix.dest_prefix }}
          VERSION: ${{ env.VERSION }}
          VERSION_BUMPS: ${{ toJson(matrix.version_bumps) }}
          PIN_UPDATES: ${{ toJson(matrix.pin_updates) }}
        # copy also rewrites plugin README/VENDOR/POWER (and docs/steering)
        # for SKILL_DIR_ALIASES in jfrog-sync-plugins.py — add a pair there
        # when a skill directory is renamed.
        run: python3 .github/scripts/jfrog-sync-plugins.py copy

      - uses: peter-evans/create-pull-request@v8
        with:
          path: plugin
          token: ${{ steps.app-token.outputs.token }}
          # Bot *user* id (276080306), not App id (3378254) — required for attribution.
          author: jfrog-agentic-release-bot[bot] <276080306+jfrog-agentic-release-bot[bot]@users.noreply.github.com>
          committer: jfrog-agentic-release-bot[bot] <276080306+jfrog-agentic-release-bot[bot]@users.noreply.github.com>
          branch: chore/sync-skills-${{ env.VERSION }}
          delete-branch: true
          # [major], [minor], or [patch] must lead the subject: plugin release
          # workflows match the merge-commit subject for \[(major|minor|patch)\].
          # The sync script only increments the patch digit (bump_patch_version),
          # so [patch] matches. Without the marker the release job stays green
          # but ships nothing.
          commit-message: '[patch] chore: sync skills to ${{ env.VERSION }}'
          title: '[patch] chore: sync skills to ${{ env.VERSION }}'
          body: |
            Vendored from `${{ env.VERSION }}` of jfrog/jfrog-skills.
